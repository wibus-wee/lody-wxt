name: Independent Acceptance
on:
  workflow_run:
    workflows: [PR Quality, PR UI Evidence]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed PR Quality run to re-evaluate with current policy
        type: string
        required: true
      capture_run_id:
        description: Completed PR UI Evidence run for this source run, when UI evidence is required
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group' || (github.event.workflow_run.name == 'PR UI Evidence' && github.event.action == 'completed'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: autonomy
    steps:
      # workflow_sha identifies this protected workflow's own source, never the PR head.
      - uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Bind controller to protected workflow snapshot
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # No pnpm install, candidate checkout, downloaded executable or PR shell command here.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AUTONOMY_APP_ID }}
          private-key: ${{ secrets.AUTONOMY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
          permission-contents: write
          permission-actions: read
          permission-administration: read
      - name: Verify evidence, independent decision and protected merge eligibility
        run: node tools/autonomy/cli.mjs accept
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTONOMY_RUN_ID: ${{ inputs.run_id || (github.event.workflow_run.name == 'PR Quality' && github.event.workflow_run.id) || '' }}
          AUTONOMY_CAPTURE_RUN_ID: ${{ inputs.capture_run_id || (github.event.workflow_run.name == 'PR UI Evidence' && github.event.workflow_run.id) || '' }}
          AUTONOMY_BOT_LOGIN: ${{ vars.AUTONOMY_BOT_LOGIN }}
          DOTS_ENDPOINT: ${{ vars.DOTS_ENDPOINT }}
          DOTS_PUBLIC_KEY: ${{ vars.DOTS_PUBLIC_KEY }}
          DOTS_TOKEN: ${{ secrets.DOTS_TOKEN }}
          AUTONOMY_IMAGE_TOKEN: ${{ secrets.AUTONOMY_IMAGE_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-acceptance-${{ inputs.run_id || github.event.workflow_run.id }}
          path: reports/autonomy/
          if-no-files-found: warn
