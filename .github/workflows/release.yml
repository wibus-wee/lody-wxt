name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    # No recompilation or full regression suite here: promote the tested PR bytes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      commit: ${{ steps.evidence.outputs.commit }}
      package_commit: ${{ steps.evidence.outputs.package_commit }}
      artifact_id: ${{ steps.evidence.outputs.artifact_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Resolve immutable verified release candidate
        id: evidence
        run: node tools/autonomy/release-candidate.mjs download "$RELEASE_TAG" dist/release
      - name: Verify original package and source-tree binding
        env:
          PACKAGE_COMMIT: ${{ steps.evidence.outputs.package_commit }}
          SOURCE_COMMIT: ${{ steps.evidence.outputs.commit }}
        run: node tools/autonomy/release-plan.mjs verify-candidate "$RELEASE_TAG" dist/release "$SOURCE_COMMIT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the exact downloaded package
        run: pnpm release:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/release-install/
  publish:
    needs: package
    environment: release-publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_COMMIT: ${{ needs.package.outputs.commit }}
      PACKAGE_COMMIT: ${{ needs.package.outputs.package_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - name: Validate automated release environment
        run: node tools/autonomy/release-plan.mjs environment release-publication
      - name: Bind verified package source to unchanged tag on main history
        run: node tools/autonomy/release-plan.mjs binding "$RELEASE_TAG" "$SOURCE_COMMIT"
      - name: Recheck original release PR evidence
        id: evidence
        run: |
          node tools/autonomy/release-candidate.mjs download "$RELEASE_TAG" release-assets
      - name: Require unchanged evidence binding
        env:
          RESOLVED_COMMIT: ${{ steps.evidence.outputs.package_commit }}
          RESOLVED_ARTIFACT: ${{ steps.evidence.outputs.artifact_id }}
        run: |
          test "$RESOLVED_COMMIT" = "$PACKAGE_COMMIT"
          test "$RESOLVED_ARTIFACT" = "${{ needs.package.outputs.artifact_id }}"
      - name: Verify artifact checksum, ZIP safety and tagged provenance using trusted tools
        run: node tools/autonomy/release-plan.mjs verify-candidate "$RELEASE_TAG" release-assets "$SOURCE_COMMIT"
      - name: Attest the verified release assets
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/lody-chrome.zip
            release-assets/INSTALL.md
            release-assets/SHA256SUMS
            release-assets/build-info.json
            release-assets/appcast.json
            release-assets/update-index.json
      - name: Verify signed subjects and exact workflow identity before publication
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -n "$ATTESTATION_BUNDLE"
          mkdir -p reports/release-attestation
          node tools/autonomy/release-plan.mjs attestations "$RELEASE_TAG" release-assets "$ATTESTATION_BUNDLE" > reports/release-attestation/verification.json
      - name: Resume draft or verify existing immutable downloads
        run: node tools/autonomy/release-plan.mjs publish-candidate "$RELEASE_TAG" release-assets "$SOURCE_COMMIT"
      - name: Retain attestation bundle and verification evidence
        if: always() && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            reports/release-attestation/
          if-no-files-found: error
