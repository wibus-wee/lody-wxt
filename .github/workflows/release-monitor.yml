name: Release monitor
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-monitor
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      download_attempts: ${{ steps.select.outputs.download_attempts }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - name: Resolve real latest stable published release
        id: select
        run: node tools/autonomy/monitor.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  installed:
    needs: select
    if: needs.select.outputs.tag != ''
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ needs.select.outputs.tag }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      verified: ${{ steps.result.outcome == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: controller
          ref: main
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.select.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          path: product
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: controller/package.json
      - name: Download published assets (bounded transport retries)
        working-directory: product
        env:
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          DOWNLOAD_ATTEMPTS: ${{ needs.select.outputs.download_attempts }}
        run: |
          for ((attempt=1; attempt<=DOWNLOAD_ATTEMPTS; attempt++)); do
            rm -rf dist/release
            if gh release download "$RELEASE_TAG" --dir dist/release; then
              exit 0
            fi
            if [ "$attempt" -lt "$DOWNLOAD_ATTEMPTS" ]; then sleep "$((attempt * 5))"; fi
          done
          exit 1
      - name: Verify published checksum inventory and tagged provenance
        id: identity
        working-directory: product
        env:
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: |
          node ../controller/tools/autonomy/release-plan.mjs binding "$RELEASE_TAG" "$(git rev-parse HEAD)"
          node ../controller/tools/autonomy/release-plan.mjs verify "$RELEASE_TAG" dist/release "$(git rev-parse HEAD)"
          mkdir -p reports/release-attestation
          node ../controller/tools/autonomy/release-plan.mjs attestations "$RELEASE_TAG" dist/release > reports/release-attestation/verification.json
          echo "sha256=$(sha256sum dist/release/lody-chrome.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install trusted controller dependencies without rebuilding the product
        working-directory: controller
        env:
          GH_TOKEN: ''
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser
        working-directory: controller
        env:
          GH_TOKEN: ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Install and exercise archive using the trusted controller verifier
        working-directory: product
        env:
          GH_TOKEN: ''
        run: node ../controller/tools/release/check-install.mjs
      - name: Require browser evidence for this exact archive
        id: result
        working-directory: product
        env:
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          ARCHIVE_SHA256: ${{ steps.identity.outputs.sha256 }}
          RESULT_FILE: reports/release-install/result.json
        run: node ../controller/tools/autonomy/monitor.mjs result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/reports/release-install/
            product/reports/release-attestation/
            product/dist/release/SHA256SUMS
            product/dist/release/build-info.json
            product/dist/release/appcast.json
  incident:
    needs: installed
    if: always() && needs.installed.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - name: Deduplicate incident or close after verified recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.installed.outputs.tag }}
          ARCHIVE_SHA256: ${{ needs.installed.outputs.sha256 }}
          MONITOR_SUCCESS: ${{ needs.installed.result == 'success' && needs.installed.outputs.verified == 'true' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/autonomy/monitor.mjs report
