name: Directory update proof
on:
  pull_request:
    paths:
      - 'tools/update-probe/**'
      - 'src/features/updates/**'
      - tools/release/update-index.mjs
      - package.json
      - pnpm-lock.yaml
      - wxt.config.ts
      - .github/workflows/directory-proof.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec wxt prepare
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick openbox
      - run: xvfb-run --auto-servernum sh -c 'openbox >/tmp/openbox.log 2>&1 & sleep 1; node tools/update-probe/run.mjs'
      - name: Build actual product for native updater journey
        env:
          LODY_UI_PINNED: '1'
        run: pnpm build
      - name: Exercise actual updater controls
        run: xvfb-run --auto-servernum sh -c 'openbox >/tmp/openbox-product.log 2>&1 & sleep 1; node --import tsx tools/update-probe/product.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-proof-${{ github.event.pull_request.head.sha }}
          path: |
            reports/directory-proof/
            reports/directory-product/
