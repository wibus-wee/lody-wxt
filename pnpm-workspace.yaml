packages:
  - .
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
# semver 6 predates provenance; the registry-signed 2023 release matches the pinned integrity.
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.1'
  - '@tanstack/react-query@5.104.1'
  - devframe@1.2.0
  - framer-motion@14.0.0
  - fumadocs-core@16.15.18
  - fumadocs-mdx@15.4.6
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - motion@14.0.0
