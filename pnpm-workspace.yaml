packages:
  - .
  - packages/*
  - vendor/lody/packages/ui
catalog:
  '@types/node': ^26.0.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: npm:@typescript/typescript6@^6.0.2
overrides:
  '@base-ui/react': 1.8.0
  '@stylexjs/stylex': 0.19.1
  '@stylexjs/unplugin': 0.19.1
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
# semver 6 predates provenance; the registry-signed 2023 release matches the pinned integrity.
trustPolicyExclude:
  - semver@6.3.1
  # Excalidraw's parser pins this pre-provenance release; integrity matches the CCE reference lockfile.
  - langium@3.3.1
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.1'
  - '@tanstack/react-query@5.104.1'
  - devframe@1.2.0
  - framer-motion@14.0.0
  - fumadocs-core@16.15.18
  - fumadocs-mdx@15.4.6
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - motion@14.0.0
patchedDependencies:
  loro-crdt@1.16.3: patches/loro-crdt-1.16.3.patch
